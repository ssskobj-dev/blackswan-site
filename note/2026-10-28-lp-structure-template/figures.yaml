thumbnail:
  title: クラファン LP 構成の雛形
  sub: スライド1枚＝1セクション、11枚で迷わない

figures:
  - type: lp_sample
    title: クラファンLPの11セクション（上から読者の疑問の順に）
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 前半5枚は「読む前の疑問」に答える
      - 後半6枚は「買う前の疑問」を消す
      - 1枚に役目は1つ、文字は大きめ
      - 直すときはその1枚だけ作り直す
  - type: compare
    title: 11枚それぞれが答える疑問
    left:
      head: "前半: 読む前の疑問"
      rows: ["表紙＝何が、いくらで、いつ", 課題＝自分の話か, 解決＝どう変わるか, 特徴＝他と何が違うか, 使い方＝面倒じゃないか]
    right:
      head: "後半: 買う前の疑問"
      rows: [仕様＝自分の環境で使えるか, ストーリー＝誰が作ったか, リターン＝何がいくらでいつ, 流れ＝支援後に何が起きるか, 注意＝損をしないか, FAQ＝残った疑問]
  - type: steps
    title: 構成を組み立てる7つの手順
    steps: ["決め事を3行書く（誰に・どう変わる・いくらでいつ）", スライド11枚に題名だけ先に付ける, 前半5枚を「読む前の疑問」の順に埋める, 後半6枚を「買う前の疑問」の順に埋める, 表紙・順番・重なりの3つを確かめる, 1枚ずつ画像で書き出して上から置く, 2〜3人に読んでもらい3つ聞く]
  - type: compare
    title: よくある失敗と、型で作ったときの直し方
    left:
      head: よくある失敗
      rows: ["表紙が商品名だけ、価格は下", 作り手の話が最初に長い, 特徴と仕様が同じ話, 届く時期がどこにも無い, 1本の長文で直す場所が不明]
    right:
      head: 型で作ると
      rows: [表紙に何が・いくら・いつ, ストーリーは後半7枚目, "特徴は3つ、仕様は数字だけ", 流れとリターンに月を書く, 直すのはその1枚だけ]
