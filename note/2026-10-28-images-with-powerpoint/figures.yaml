thumbnail:
  title: PowerPointで作る クラファンの画像
  sub: 高さだけ縦長にして、1枚ずつPNGで書き出す

figures:
  - type: compare
    title: スライドの初期設定と、縦長にした設定
    left:
      head: 初期設定のまま（16:9）
      rows: ["幅33.87cm×高さ19.05cm", "書き出すと1280×720px", "横長で、スマホでは文字が小さい", "1枚に詰め込みがちになる"]
    right:
      head: 高さだけ伸ばす（この記事）
      rows: ["幅33.87cmはそのまま", "高さを50.8cmに伸ばす", "書き出すと1280×1920px", "スマホの1画面に1セクション"]
  - type: steps
    title: PowerPointで画像を作って書き出す手順
    steps: [スライドの高さだけ縦長に変える, ガイド線を引いて余白を決める, 1枚＝1セクションで11枚作る, 文字は1行20字まで・大きめに, 写真は元の大きさ以下で置く, PNGで1枚ずつ書き出す, 幅と容量を確かめて番号を付ける]
  - type: lp_sample
    title: スライド1枚＝1セクションで11枚
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 幅は全部33.87cmのまま
      - 2枚目以降は複製でそろえる
      - 1枚に伝えることは1つ
      - 直すときは1枚だけ書き出し直す
  - type: compare
    title: ぼやける原因と、直し方
    left:
      head: ぼやける原因
      rows: [小さい写真を引き伸ばした, 横長のまま作ってスマホで縮んだ, JPGで何度も保存し直した, スクリーンショットで切り取った]
    right:
      head: こうすると直る
      rows: [写真は元の大きさ以下で置く, スライド自体を縦長にする, PNGで1回だけ書き出す, 書き出し機能を使う]
