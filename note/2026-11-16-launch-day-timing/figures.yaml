thumbnail:
  title: クラファン 開始日の決め方
  sub: 終了日から逆算｜月初・月末・曜日

figures:
  - type: compare
    title: 「できた日に公開」と「終了日から逆算」
    left:
      head: できた日に公開
      rows: ["終了日は審査しだいで決まる", "月をまたいで入金が1か月遅れる", "終了前の1週間が連休に当たる", "開始3日間の告知が間に合わない", "公開後は開始日も終了日も直せない"]
    right:
      head: 終了日から逆算
      rows: ["入金月→終了日を月の最終週に", "お届け月→終了日の上限", "終了前1週間を動ける日に", "募集期間を引いて開始日", "審査の2週間を引いて申請日"]
  - type: compare
    title: 終了日が4日違うと、入金は1か月ずれる（Makuake）
    left:
      head: 11月2日（月）に終了
      rows: ["終了した月は11月", "入金は12月25日", "12月の仕入れに使えない", "開始日を4日早めれば済んだ"]
    right:
      head: 10月29日（木）に終了
      rows: ["終了した月は10月", "入金は11月25日", "11月の仕入れに使える", "月末最終日は不可。最終週の平日に"]
  - type: steps
    title: 終了日から逆算して開始日を決める手順
    steps: [リターンを届ける月から終了日の上限を出す, 入金してほしい月の前月の最終週に終了日を置く, 終了前1週間と終了時刻を動ける日に合わせる, 募集期間を引いて開始日を出す, 開始日から審査の2週間を引いて申請日を決める, 表紙・リターン・流れに同じ日付を入れて申請する]
  - type: lp_sample
    title: 日付が入るのは11枚のうち5枚だけ
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 表紙：終了日と22:00の1行
      - リターン：名前の先頭にお届け月
      - 流れ：終了→製造→発送の線表
      - 注意：連休・年末年始の休業
      - FAQ：いつ届くか・いつ決済か
      - 残り6枚は商品ごとに作って使う
  - type: calendar
    title: 申請日から公開までの4週間（12月14日公開の例）
    weeks: ["終了日・開始日・申請日を決める。 入金月とお届け月を点検", "11枚を作る。 前の商品があれば日付の5枚を差し替え", "11月30日ごろに申請。 修正はその日のうちに返す", "開始3日分の告知を予約。 12月14日に公開して3日集中"]
