thumbnail:
  title: 先行予約LPの作り方
  sub: Makuake以外の自社ECでも使える構成

figures:
  - type: steps
    title: 先行予約LPを作る手順
    steps: [締切・お届け時期・条件・返金を決める, 11枚の型のうち3枚を予約向けに差し替える, 締切とボタンを上・中・下に置く, スライドをPNGで書き出して順に貼る, 予約期間の1か月を決めて公開する, 公開前に5つの確認をする]
  - type: lp_sample
    title: 先行予約LPも「11セクションの型」で
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, 予約の枠, 予約〜お届け, 返金の条件, FAQ]
    notes:
      - クラファンの型と骨は同じ
      - 差し替えるのは後半の3枚だけ
      - 締切とボタンは上・中・下に置く
      - 同じスライドから2つの版が出せる
  - type: compare
    title: クラファンページと先行予約LPの違い
    left:
      head: クラファンのページ
      rows: [期間と残り日数はサイトが表示, リターン一覧はサイトの枠, 支援ボタンは画面に固定, 規約はサイトが説明]
    right:
      head: 自社ECの先行予約LP
      rows: [締切の日付を自分で3か所に, 予約の枠を1枚にまとめる, ボタンも上・中・下に置く, キャンセルと返金を自分で書く]
  - type: calendar
    title: 先行予約の1か月
    weeks: ["公開。既存のお客さんに締切つきで告知", "残り数量か質問への答えを1回発信", "締切1週間前の再告知", "前日と当日に最後の告知。翌日に受付終了"]
