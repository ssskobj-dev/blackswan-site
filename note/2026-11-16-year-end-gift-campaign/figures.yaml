thumbnail:
  title: クラファン 年末ギフト向けページの作り方
  sub: 締切と届く日を「表紙・リターン・流れ」の3か所に

figures:
  - type: compare
    title: 贈れないページと、安心して贈れるページ
    left:
      head: 贈れない（判断できない）
      rows: ["お届けは「12月中」とだけ", "締切がプロジェクト終了日と同じ", "のし・カードの有無が無い", "相手の住所に送れるか分からない", "年明けになった場合の扱いが無い"]
    right:
      head: 贈れる（安心して渡せる）
      rows: ["「12月10日まで→16日発送」", "締切は梱包日数を引いて別に決める", "仕様に包装・のし・カードを1行", "FAQで宛先の扱いを先に答える", "年内分と年明け分を別リターンに"]
  - type: steps
    title: 年末ギフトのページを作る手順
    steps: [届けたい日を1つに決める（お歳暮・クリスマス・正月）, 配送会社の年末の案内を見て発送最終日を決める, 梱包の日数を引いて申し込みの締切を決める, リターンを「年内お届け」と「年明けお届け」に分ける, 締切と届く日を表紙・リターン・流れの3か所に同じ言葉で, 11枚に分けてギフト用に割り当てる, 公開後は締切を活動報告で3回知らせる]
  - type: lp_sample
    title: ギフト用の11枚の割り当て
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 表紙：開ける瞬間の写真と締切の1行
      - 仕様：包装・のし・カード・サイズ
      - リターン：年内分と年明け分を別に
      - 流れ：日付入りの線表
      - 注意：遅延・休業・数の上限
      - FAQ：のし・宛先・年内に届くか
  - type: compare
    title: 「流れ」の1枚を書き直す前と後
    left:
      head: 書き直す前
      rows: ["12月上旬：プロジェクト終了", "12月中：順次発送", "お手元に届きます", "→ 渡す日に間に合うか分からない"]
    right:
      head: 書き直した後（日付の線表）
      rows: ["12/10まで：年内お届けの締切", "12/11〜15：包装と宛先の確認", "12/16までに発送（追跡番号あり）", "12/18〜20ごろ：お届け", "12/11以降の申し込みは1月中旬"]
  - type: calendar
    title: 年内に届けるための逆算（11月中旬〜12月中旬）
    weeks: ["届けたい日と 配送の締切を 決めて 年内分と 年明け分の リターンを作る", "5枚を 差し替えて 公開。 締切を 活動報告で 知らせる", "締切1週間前 と前日に 残りの数を 知らせ 締切後は 年明け分へ", "包装して 発送。 追跡番号を 報告し 配達完了を 確かめる"]
