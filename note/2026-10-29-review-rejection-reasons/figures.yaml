thumbnail:
  title: クラファン 審査 落ちる理由
  sub: 公式の基準から読む7つの原因と、通る書き方への直し方

figures:
  - type: compare
    title: 審査で直されやすい書き方と、通りやすい書き方
    left:
      head: 直される書き方
      rows: ["無料・プレゼント・寄付", "業界No.1・世界初・最安", "定価9,800円→50%OFF", "肌が白くなる・痩せる", "リターン：本品1個（時期なし）", "拾ってきた写真・有名ブランド名"]
    right:
      head: 通りやすい書き方
      rows: ["ご支援・リターン・先行予約", "数字と素材で言い切る", "一般販売予定価格＋計画の根拠", "成分・使い心地・用途を書く", "内容・数量・色・届く月を1枚に", "自分で撮る。許可を取る"]
  - type: steps
    title: 提出前に自分でやる7つの点検
    steps: [公式の審査基準を1回通して読む, 禁止の言葉を検索して置き換える, 強調の言葉を「証明できるか」で分ける, 価格の比較に根拠があるかを見る, リターンに内容・数量・届く月を入れる, 写真・ロゴ・人物の権利を確かめる, "必要なマーク・許可番号をページに載せる"]
  - type: lp_sample
    title: 指摘が出やすいのは、この4枚
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 表紙：No.1・世界初・価格の比較
      - 特徴：効果の断言、他社との比較
      - 仕様：PSE・技適などのマークの有無
      - リターン：数量・届く月・有効期限
      - 直すときは1枚だけ作り直せばよい
  - type: calendar
    title: 審査の往復を見込んだ、公開までの1か月
    weeks: ["ページを書く 7つの点検を やってから提出", "1回目の審査 （即日〜5日） 指摘を直して 再提出", "2〜3回目の 審査と修正 ここで公開日が ずれやすい", "公開 初動の告知 支援者への 返事"]
