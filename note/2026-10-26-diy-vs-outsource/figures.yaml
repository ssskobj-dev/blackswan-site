thumbnail:
  title: 自作か外注か、1件で比べる
  sub: クラファンページの時間と金額に、本数を掛けて決める

figures:
  - type: steps
    title: 自作か外注か、1件あたりで比べる手順
    steps: [この先1年で出す本数を数える, 構成・文章・画像・入稿を○×で分ける, 自作の時間を予定表に書き込んでみる, 外注の金額と納期を書く, 自分の時間を金額に直すか横に置く, 本数を掛けて1件あたりに割る, 納品の形（自分で直せるか）で決める]
  - type: lp_sample
    title: 自作するなら11枚に分けて作る
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - まず11枚に見出しだけ書く
      - 各枚の中身を1〜3行で埋める
      - 写真が無い枚は文字と図形で埋める
      - 2本目は文字と写真の差し替えだけ
  - type: calendar
    title: 自作で1本作る4週間（初回の例）
    weeks: ["商品情報を集める 写真をそろえる 見出しを11枚", "文章を埋める 写真を置く 画像に書き出す","入稿して申請する 価格とリターンを固める", "審査の修正に対応 公開と初動の告知"]
  - type: compare
    title: 単発の外注と月額制、1件あたりで見ると
    left:
      head: 単発の外注（相場）
      rows: ["約10万円／本", "納期2週間〜1か月", "構成の材料は自分で出す", "画像だけの納品だと直せない", "毎月出すと年100万円超"]
    right:
      head: 月額制（BlackSwan）
      rows: ["1件1,990円から（ライト）", "翌営業日にスライドで届く", "下書きは任せて仕上げは自分", "文字・色・順番は自分で直せる", "撮影・入稿は含まれない"]
