thumbnail:
  title: クラファン リターン設計の基本
  sub: 価格帯3段と早割の組み方｜一般販売価格から逆算

figures:
  - type: compare
    title: 「とりあえず安く」と「一般販売価格から逆算」
    left:
      head: とりあえず安く
      rows: ["原価ぎりぎりで価格を先に決める", "手数料20%と送料を引いたら赤字", "一般販売の価格が決められない", "公開後は金額も数量も直せない", "段が多すぎて選べない"]
    right:
      head: 一般販売価格から逆算
      rows: ["税込・送料込みの予定価格を1つ決める", "割引ごとに1個の手残りを計算", "価格帯3段：単品・2個・3個", "単品に早割の階段3段", "合計6〜8個に収める"]
  - type: steps
    title: リターンを数字で決める7つの手順
    steps: [一般販売の予定価格を税込・送料込みで決める, 割引ごとに「価格−手数料−送料−原価」を計算, 価格帯を3段にする（単品・2個セット・3個セット）, 単品に超早割・早割・通常割の3段を入れる, 超早割の数量を目標金額の3割から逆算, セットは1個あたりで早割より安くする, お届け月を名前に入れて公開前に全部確かめる]
  - type: compare
    title: 一般販売予定価格12,000円の例（仮の数字）
    left:
      head: 単品（早割の階段）
      rows: ["超早割 30%OFF 8,400円", "限定20個（手残り2,320円）", "早割 25%OFF 9,000円", "限定50個", "通常割 20%OFF 9,600円", "数量の上限なし"]
    right:
      head: セット（価格帯の上2段）
      rows: ["2個セット 30%OFF", "16,800円・1個8,400円", "限定30組", "3個セット 35%OFF", "23,400円・1個7,800円", "限定20組"]
  - type: lp_sample
    title: リターンの枚は、決めた表をそのまま載せる
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - リターン：1段を1行で縦に並べる
      - 書くのは名前・割引率・価格・数量・お届け月
      - 流れ：終了→製造→発送の月
      - 注意：公開後は変更不可、送料込み・税込
      - FAQ：いつ届くか、セットの送料
      - 残りの6枚は商品ごとに作る
  - type: compare
    title: 公開前に決めること、公開後に直せないこと
    left:
      head: 公開前に決める
      rows: ["全部の段の価格と数量", "お届け月（終了から半年以内）", "サイズ・色の選択肢", "手残りが黒字かの確認", "合計の個数（6〜8個）"]
    right:
      head: 公開後は直せない
      rows: ["設定済みの金額・内容・限定数", "売り切れた段と同じ条件の再設定", "追加は再審査が必要", "だから表を先に完成させる"]
