thumbnail:
  title: クラファンのページは公開後に修正できる？
  sub: 直せる箇所・直せない箇所と、見つけたときの手順

figures:
  - type: compare
    title: 公開後に直せるもの・直せないもの（CAMPFIREの場合）
    left:
      head: 直せない（公開前に確定）
      rows: [タイトル, 目標金額と募集期間, 募集方式とカテゴリ, 公開済みリターンの編集・削除, 本人確認と振込先]
    right:
      head: 直せる（編集後に再申請）
      rows: [メイン画像, 概要文と動画, 本文, リターンの追加, プロフィール]
  - type: steps
    title: 公開後に誤りを見つけたときの手順
    steps: [直したい箇所を全部書き出す, 事実の誤りか見た目かに分ける, Makuakeはキュレーターに1通で相談, CAMPFIREは編集してまとめて再申請, 直せないものは活動報告で補う, 次回のチェック表に書き足す]
  - type: lp_sample
    title: セクション単位で作っていれば、直すのは1枚
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [直す箇所のスライドだけ開く, 文字を直してPNGに書き出す, 本文はその1枚だけ差し替える, 補足はFAQの枚に書き足す]
  - type: steps
    title: リターンの内容に誤りがあったとき
    steps: [既存リターンは直せない前提で考える, 正しい内容の新しいリターンを追加する, 誤りのある段は本文で案内して誘導, 支援済みの人には個別に連絡する, Makuakeは追加前にキュレーターへ相談]
