thumbnail:
  title: Kickstarterの ページの作り方
  sub: Makuakeと違う構成と、5つの入力欄

figures:
  - type: compare
    title: MakuakeとKickstarter、ページの作りの違い
    left:
      head: Makuake
      rows: [縦長の画像を上から順に並べる, 見出しも本文も画像で作りがち, リターンは本文の下に並ぶ, 注意事項は本文の中に書く]
    right:
      head: Kickstarter
      rows: [ストーリーやFAQなど欄に分かれる, 見出しは画像、本文は文字でも可, リワードは右の欄に画像つき, リスクと課題・AIの使用の欄, タイトル60字、サブ135字]
  - type: steps
    title: Kickstarterのページを作る7つの手順
    steps: [タイトル60字・サブタイトル135字を書く, 目標金額と期間（約4週間）を決め切る, メイン画像を1024×576pxで1枚作る, ストーリーを「スライド1枚＝1セクション」で作る, リワードを右欄に画像つきで作る, リスクと課題、AIの使用を書く, FAQを入れて提出し、審査後に公開]
  - type: lp_sample
    title: ストーリーは11枚の型をそのまま使う
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [Makuakeで使った11枚の構成を流用, 見出しと主役の写真だけ16:9で書き出す, 説明の文章は画像にせず文字で打つ, 「解決」「使い方」に試作品の写真か動画, 完成予想図（CG）だけで見せない]
  - type: compare
    title: Makuakeの素材、そのまま使える？
    left:
      head: そのまま使えるもの
      rows: [11枚の構成（並び順）, 商品写真・試作品の動画, 特徴・仕様・ストーリーの文章, リターンの内容と価格の考え方]
    right:
      head: 作り直す・書き足すもの
      rows: [タイトルとサブタイトル, メイン画像（1024×576px）, リワード画像（文字なし）, リスクと課題（対策まで）, AIの使用の開示, FAQ（5問から）]
