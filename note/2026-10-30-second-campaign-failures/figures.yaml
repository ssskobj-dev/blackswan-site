thumbnail:
  title: クラファン 2回目で失敗する人の特徴
  sub: 1回目との違いと、支援者を起点にした直し方

figures:
  - type: compare
    title: 1回目と2回目は、ここが違う
    left:
      head: 1回目
      rows: ["初日は知人・家族の支援が多い", "見る人にとって初めての商品", "不安なので準備を重ねる", "ページはゼロから作る", "告知は一斉に広く"]
    right:
      head: 2回目
      rows: ["知人は「もう支援した」状態", "「前に見た」「持っている」", "慣れて準備を減らしがち", "11枚のうち4枚を直すだけ", "1回目の支援者に先に知らせる"]
  - type: steps
    title: 2回目で失敗する人の特徴5つ
    steps: [1回目の結果をそのまま目標にする, ページを「前回のまま」出す, 1回目の支援者に先に知らせない, 価格の理由を書かずに早割だけ安くする, 公開前の準備期間を縮める]
  - type: lp_sample
    title: 2回目に書き直すのは、この4枚
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 表紙：2回目に出す理由を1行で
      - 課題：1回目に届いた質問を入れる
      - リターン：2回目の価格と、その理由
      - FAQ：1回目の質問に答える
      - 変更点の1枚を足す。他の枚は残す
  - type: steps
    title: 2回目を組み立て直す手順
    steps: [1回目を「誰が・なぜ」で振り返る, 出す理由を1行で決め、目標額を知人以外から決める, 11枚に分けて4枚だけ書き直す, 「前回からの変更点」を1枚足す, 1回目の支援者向けのリターンを1つ用意, 公開前に1回目の支援者に先に知らせる, 掲載基準と1回目との間隔を確認する]
  - type: calendar
    title: 2回目を出すまでの1か月
    weeks: ["1回目を 振り返る 出す理由と 目標額を決める", "表紙・課題・ リターン・FAQ と変更点の 5枚を作る", "1回目の 支援者に先に 知らせて 感想をもらう", "掲載基準を 確認して申請 審査の修正に 対応して公開"]
