thumbnail:
  title: ガジェット クラファン ページの構成
  sub: スペックは「困りごと→数字→比べ方」の3行で見せる

figures:
  - type: compare
    title: スペックの羅列と、伝わる書き方
    left:
      head: 羅列（伝わらない）
      rows: ["表紙に数字を5つ以上並べる", "単位だけで比べる相手が無い", "写真は商品単体で大きさ不明", "対応機種・安全表示は後回し", "一覧表が何枚も出てくる"]
    right:
      head: 3行に翻訳（伝わる）
      rows: ["表紙の数字は主役1つだけ", "困りごと→数字→身近な比べ方", "手に持った写真に数字を重ねる", "注意の1枚に先に書く", "一覧表は仕様の1枚だけ"]
  - type: steps
    title: ガジェットのページを作る手順
    steps: [スペックを書き出し「主役・脇役・確認」に仕分ける, 主役3つを「困りごと→数字→比べ方」の3行にする, 比べる相手は前モデル・今の方法・一般的な製品, 大きさ・場面・寄りの写真を3種類撮る, 11枚に分けてガジェット用に割り当てる, 一覧表は「仕様」の1枚にまとめる, 対応機種と安全表示を先に確かめて書く]
  - type: lp_sample
    title: ガジェット用の11枚の割り当て
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 表紙：主役の数字を1つだけと一言
      - 課題：読む人の言葉で困りごと
      - 解決・特徴：主役を3行ずつ
      - 仕様：一覧表はここに1枚だけ
      - 流れ：量産の状況と届く時期
      - 注意：対応機種・安全表示・個体差
  - type: compare
    title: スペック1つを書き直す前と後
    left:
      head: 書き直す前（一覧のまま）
      rows: ["容量 〇〇mAh", "出力 〇〇W", "重さ 〇〇g", "USB-C対応", "→ どれが自分に関係あるか不明"]
    right:
      head: 書き直した後（1枚に1つ）
      rows: ["1行目 困りごと：外で充電が切れる", "2行目 数字：容量 〇〇mAh", "3行目 比べ方：スマホ△回ぶん", "下に手に持った写真を置く", "出力・重さは別の枚か仕様へ"]
  - type: calendar
    title: ガジェットを出すまでの1か月
    weeks: ["スペックを 仕分けて 主役3つを 3行にする", "写真を3種類 撮って 11枚を作る", "掲載基準を 確かめて申請 審査の修正に 対応する", "公開して 質問に答え FAQの枚に 足していく"]
