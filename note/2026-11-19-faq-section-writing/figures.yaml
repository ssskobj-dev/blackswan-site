thumbnail:
  title: クラファンのFAQの書き方
  sub: 問い合わせを減らす質問10個と、答えの型

figures:
  - type: steps
    title: FAQを作る手順
    steps: [人に見せて質問を集める, 支援をためらわせる質問だけ残す, 定番の10問と照らし合わせる, 答えは「結論・条件・案内」の3行, 本文・リターン欄と数字を合わせる, 公開後に来た質問を足していく]
  - type: compare
    title: FAQに入れる定番の10問
    left:
      head: 商品のこと
      rows: [サイズ・色・重さは？, 使い方や対応する環境は？, 不良品や故障のときは？, 一般販売との違いは？, 複数買える？まとめ買いは？]
    right:
      head: お届けと手続きのこと
      rows: [発送はいつ？, 送料はかかる？, 支払いはいつ・どう引かれる？, 住所の変更・海外への発送は？, 質問はどこに送ればいい？]
  - type: compare
    title: 問い合わせが減らないFAQ・減るFAQ
    left:
      head: 減らないFAQ
      rows: [質問が売り手の言葉, 答えが長くて結論が最後, 本文と数字が食い違う, 商品の自慢のくり返し, 言い切りで約束してしまう]
    right:
      head: 減るFAQ
      rows: [質問は買う人の言葉のまま, 1行目に結論, 本文・リターン欄と同じ表記, 迷いを消す質問だけ, 予定と、遅れたときの知らせ方]
  - type: lp_sample
    title: FAQはページの最後の1枚
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [FAQの枚は5問ずつ、1〜2枚, 質問を大きく、答えは小さめの字, 公開後に増えた質問はこの枚に足す, 他の枚に触らずに直せる]
