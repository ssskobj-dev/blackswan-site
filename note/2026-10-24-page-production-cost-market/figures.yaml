thumbnail:
  title: クラファンのページ制作費用の相場
  sub: 単発外注・ココナラ・月額制を同じ物差しで比べる

figures:
  - type: compare
    title: 単発の外注と月額制、初めての1本なら
    left:
      head: 単発の外注（相場）
      rows: ["約10万円／本", "中心は10万〜16万円", "納期2週間〜1か月", "修正は回数制が多い", "納品形式は依頼先しだい"]
    right:
      head: 月額制（BlackSwan）
      rows: ["月額3,980円で2件", "1件あたり1,990円", "翌営業日にスライドで届く", "文字・色・順番は自分で直せる", "撮影・入稿は含まれない"]
  - type: steps
    title: 見積もりを同じ物差しで比べる手順
    steps: [この先1年で出す回数を数える, 自分でやる工程と頼む工程を分ける, 依頼文を1枚にまとめる, 見積もりは「1本あたり・納期・修正・形式」で並べる, 納品形式が自分で直せるか確かめる, 公開日から逆算して納期が合うか見る]
  - type: lp_sample
    title: 依頼文は11枚に分けて書くと伝わる
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 費用は枚数より「構成を誰が考えるか」で決まる
      - 自分で書ける枚はテキストを先に渡す
      - 写真がある枚と無い枚を分けて伝える
      - 11枚のどこまで頼むかで見積もりがそろう
  - type: calendar
    title: 見積もりから公開まで（納期2週間の例）
    weeks: ["商品情報と写真をそろえる。見積もりを2〜3件取る", "依頼。初稿を待つ間にリターンと価格を決める", "初稿を受け取り修正。入稿して申請", "審査の修正に対応。公開と初動の告知"]
