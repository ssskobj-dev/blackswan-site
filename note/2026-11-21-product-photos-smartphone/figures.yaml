thumbnail:
  title: クラファンの商品写真を スマホで撮る手順
  sub: ページに要る8カットと、失敗しない撮り方

figures:
  - type: steps
    title: スマホで商品写真を撮る7つの手順
    steps: [8カットのリストを紙に書く, 日中の窓際、光は横か斜め前から, 白い模造紙を壁から机へカーブで垂らす, "レンズを拭き、1倍レンズ、ズームは使わない", 三脚か積んだ本に固定、タイマーで切る, 1カット3〜5枚、カット1は縦と横, 残すのは1〜2枚。補正は明るさ・傾き・切り抜き]
  - type: lp_sample
    title: 11枚の型に、8カットをこう当てる
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [表紙 → 主役カット（縦と横）, 解決・使い方 → 使っている場面, 特徴 → 細部の寄り, 仕様 → 大きさの比較と5方向, ストーリー → 作り手の手元, リターン → 色違いの並びと一式]
  - type: compare
    title: 写真が「素人っぽく」なる原因と直し方
    left:
      head: よくある撮り方
      rows: [届いた日に手元で何枚か撮る, 部屋の照明の下で撮る, 手で持って撮り、高さがばらつく, ズームと広角で歪む, 彩度を上げて実物より鮮やかに]
    right:
      head: 8カットで撮る
      rows: [段ごとに要るカットを先に決める, 窓際の自然光、照明は消す, 固定して同じ高さ・距離で撮る, 1倍レンズで自分が近づく, 明るさ・傾き・切り抜きだけ直す]
  - type: compare
    title: ページに要る8カット
    left:
      head: 前半の段で使う4カット
      rows: [1 主役カット（表紙）, 2 使っている場面（解決・使い方）, 3 大きさが分かる1枚（仕様）, 4 細部の寄り（特徴）]
    right:
      head: 後半の段で使う4カット
      rows: [5 正面・横・背面・上・底（仕様）, 6 色違いを並べた1枚（リターン）, 7 中身と付属品の一式（リターン）, 8 作り手の手元（ストーリー）]
