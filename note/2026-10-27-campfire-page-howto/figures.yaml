thumbnail:
  title: CAMPFIRE ページ 作り方
  sub: 審査に出せる構成と画像サイズ（2026年版）

figures:
  - type: compare
    title: CAMPFIREで用意する画像（公式ヘルプ 2026年2月更新）
    left:
      head: 画像のサイズの目安
      rows: ["メイン・本文 1200×800程度", "リターン画像 900×600程度", "プロフィール 200×200以上", "比率は3:2・1枚10MBまで"]
    right:
      head: 本文の決まり
      rows: ["文字の大きさは変えられない", "文字の色は黒だけ", "画像と文字は6対4が目安", "見出しの役目は画像が担う"]
  - type: steps
    title: CAMPFIREのページを自分で作って審査に出す手順
    steps: [タイトル40字・概要文150字を先に書く, 目標金額と募集期間を決める, メイン画像を1200×800で1枚作る, 本文の画像を1枚＝1セクションで11枚作る, 画像と文章を6対4で交互に置く, リターン画像を900×600で作る, プロフィール・本人確認をそろえ、読んでもらって提出]
  - type: lp_sample
    title: 本文の画像は「スライド1枚＝1セクション」
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 比率は3:2で全部そろえる
      - 上に大きく見出し、下に写真と説明
      - 1枚に伝えることは1つ
      - 直すときは1枚だけ作り直す
  - type: calendar
    title: 初めて出す人の1か月（公開日から逆算）
    weeks: ["タイトル・期間・ 目標を決める 写真を集める", "スライド11枚 メイン画像 リターン画像 この3つを作る", "本文に入力する 限定公開URLで 読んでもらう 直して提出する", "審査は即日〜5日 （土日祝を除く） 審査中は直せない 終わったら公開"]
