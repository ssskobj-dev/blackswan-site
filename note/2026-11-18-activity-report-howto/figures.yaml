thumbnail:
  title: クラファン 活動報告の書き方
  sub: 公開中にページを育てる｜8本の予定と1本の型

figures:
  - type: compare
    title: 活動報告、届かない書き方と育てる書き方
    left:
      head: 思いついた時に書く
      rows: ["公開初日と最終日だけ投稿する", "内輪へのお礼だけで終わる", "長文を1本に詰め込む", "悪い知らせを配送直前に出す", "毎回ゼロから文章を考える"]
    right:
      head: 予定と型で書く
      rows: ["公開前に8本の予定を決めておく", "初めて読む人にも分かる書き出し", "短く数日に1回、写真を1〜3枚", "遅延や変更は分かった時点で出す", "ページのセクションがネタ帳になる"]
  - type: calendar
    title: 公開中4週間の活動報告の配分（8本の例）
    weeks: ["開始の報告とお礼裏話を1本足す", "応援の声を紹介し使い道を写真で", "舞台裏と進捗報告達成の報告", "残り3日と最終日終了後のお礼"]
  - type: steps
    title: 活動報告1本の型（30分で書ける順番）
    steps: [題名は30字以内で「何が起きたか」を先に書く, 1行目に、今どこまで進んでいるかを書く, 次に、それが今後どうなるかを1つ書く, 写真を1〜3枚、文字の説明を添える, お願いは1つだけ（共有・コメント・残り日数）, 本文の数字がページと一致しているか見る, 投稿時刻は朝8時〜夜23時の間にする]
  - type: lp_sample
    title: ページのセクションが、そのまま活動報告のネタ帳になる
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 課題の枚→「開発のきっかけ」の報告
      - 使い方の枚→「こんな使い方も」の報告
      - 仕様の枚→「生産の進捗」の報告
      - リターンの枚→「残り数・残り日数」の報告
      - FAQの枚→「よくいただく質問」の報告
