thumbnail:
  title: クラファン 早割 割引率の決め方
  sub: 数量と期間で損をしない設計｜手残りから逆算する

figures:
  - type: compare
    title: 早割で損をする2つの方向と、損をしない決め方
    left:
      head: 割引率を先に決める
      rows: ["深すぎる：送料と原価は減らない", "手数料20%・送料800円で", "5,000円の手残りは700円", "浅すぎる：初日に目標3割へ届かず", "前回より深くして次回が苦しくなる"]
    right:
      head: 手残りから逆算する
      rows: ["手残りの下限を1行で決める", "上限の割引率は一番深い段だけ", "段は3〜5段・差は5ポイント", "深い段の数量＝目標の3割÷価格", "浅い段は上限なしで終了まで残す"]
  - type: steps
    title: 早割の割引率を損せず決める7つの手順
    steps: [割引率ごとの手残りを一覧にして「使わない率」を決める, 段を3〜5段にし、一番浅い段を一般販売価格に寄せる, 一番深い段の数量を目標金額の3割から逆算する, 期間に合わせて段が消える順番を決める, セット割は1個あたりで超早割を下回る価格にする, 毎月出すなら割引率の上限を固定して表に記録する, 公開前に全段の手残り・合計・価格の見せ方を確かめる]
  - type: compare
    title: 予定価格12,000円・原価3,600円・送料800円の例（仮の数字）
    left:
      head: 手残り（円・手数料20%）
      rows: ["20%OFF 9,600→3,280", "25%OFF 9,000→2,800", "30%OFF 8,400→2,320", "40%OFF 7,200→1,360", "50%OFF 6,000→400", "下限1,000円なら上限40%"]
    right:
      head: 数量と期間（目標60万円）
      rows: ["超早割30%／20個：初速3日で完売", "20個×8,400円＝目標の3割", "早割25%／50個：2〜3週目で完売", "通常割20%／上限なし：終了日まで", "2個セットは1個8,000円"]
  - type: calendar
    title: 段が消えていく順番（公開から1か月の例）
    weeks: ["公開。初速3日で超早割が売り切れ目標の3割に届く", "早割が売れる週。完売の報告を出す", "早割が売り切れ。通常割とセットが残る", "通常割は終了まで残す。終了1週間前に駆け込み"]
  - type: lp_sample
    title: リターンの枚と注意の枚に、決めた表を載せる
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - リターン：段ごとに割引率・価格・数量・お届け月
      - 画像にも割引率と数量を書く
      - 注意：公開後は変更不可、送料込み・税込
      - 翌月は数字と写真を差し替えるだけ
      - 設計もページも「表の更新」になる
