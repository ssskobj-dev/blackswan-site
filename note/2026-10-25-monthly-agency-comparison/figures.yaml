thumbnail:
  title: クラファン代行の 月額サービス比較
  sub: 何件出すなら元が取れるか

figures:
  - type: steps
    title: 月額サービスを比べる6つの項目
    steps: [月に何件まで作れるか（上限）, 使わなかった枠は翌月に残るか, 頼んでから届くまでの日数, 届く形式を自分で直せるか, 含まれない作業（撮影・入稿など）, 解約の条件と最低利用期間]
  - type: compare
    title: 月4件まではライト、5件からスタンダード
    left:
      head: ライト＋追加
      rows: ["月額3,980円で2件", "3件目から1件1,800円", "4件なら合計7,580円", "5件なら合計9,380円", "未使用分の繰り越しは無し"]
    right:
      head: スタンダード
      rows: ["月額7,980円で6件", "1件あたり1,330円", "月5件以上なら安い", "7件目から1件1,200円", "月12件以上ならプロ"]
  - type: calendar
    title: 月額制で1か月を回す
    weeks: ["商品情報と写真をまとめて送る", "翌営業日に届いたスライドを直す。入稿と申請", "審査の修正。次の商品の情報集め", "公開と初動告知。来月の件数を決定"]
  - type: lp_sample
    title: 届く形式は「自分で直せる」か
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 画像だけの納品は、1文字直すのも依頼待ち
      - スライドなら価格やリターンを自分で直せる
      - 11枚の型が手元に残り、翌月は差し替えだけ
      - 比べるときは「形式」を金額と同じ重さで見る
