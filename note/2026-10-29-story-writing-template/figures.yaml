thumbnail:
  title: クラファン ストーリーの書き方
  sub: "1,500文字の雛形と、11の箱への字数配分"

figures:
  - type: compare
    title: 手が止まるストーリーと、読まれるストーリー
    left:
      head: よくある失敗
      rows: [作り手の思いから書き始める, "3,000字を超えて商品が後回し", 特徴と仕様が同じ話になる, 届く時期がどこにも無い]
    right:
      head: 先に箱と字数を決める
      rows: ["本文全体で1,500字", 作り手の話は400字まで, 11の箱に先に字数を配る, 表紙に何が・いくら・いつ]
  - type: lp_sample
    title: "1,500字を11の箱に配る（スライド1枚＝1セクション）"
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 前半5枚で550字（読む前の疑問）
      - 後半6枚で950字（買う前の疑問）
      - 作り手の話は7枚目に400字
      - 1枚の下に書く文は2〜5行だけ
  - type: compare
    title: 箱ごとの字数の目安（合計1,500字）
    left:
      head: "前半 550字"
      rows: ["表紙 50字", "課題 150字", "解決 100字", "特徴 150字（3つまで）", "使い方 100字"]
    right:
      head: "後半 950字"
      rows: ["仕様 80字", "ストーリー 400字", "リターン 150字", "流れ 100字", "注意 100字", "FAQ 120字"]
  - type: steps
    title: ストーリーを書く7つの手順
    steps: ["決め事を3行書く（誰に・どう変わる・いくらでいつ）", "1,500字を11の箱に配る", 前半5つの雛形を埋める, 後半6つの雛形を埋める, 作り手の400字を3つに分けて書く, 超えたぶんを削る（形容詞→重複→音読）, "2〜3人に読んでもらい3つ聞く"]
