thumbnail:
  title: クラファンページの 使い回しはNG？
  sub: 2回目以降、残す枚と直す枚の分け方

figures:
  - type: compare
    title: 使い回してよいのは「型」、直すのは「中身」
    left:
      head: そのまま使い回せる
      rows: [11枚の構成とレイアウト, 解決・特徴・使い方・仕様, 写真（色や形が同じなら）, スライドのファイルそのもの]
    right:
      head: 2回目に直す
      rows: [表紙の一言と出す理由, 課題とFAQを届いた質問で, リターン・流れ・注意の日付と価格, 前回からの変更点を1枚足す]
  - type: lp_sample
    title: 11枚を「残す・更新・直す」に仕分ける
    sections: [表紙 / 直す, 課題 / 直す, 解決 / 残す, 特徴 / 残す, 使い方 / 残す, 仕様 / 残す, ストーリー / 追記, リターン / 更新, 流れ / 更新, 注意 / 更新, FAQ / 直す]
    notes:
      - 残す4枚は商品の事実が変わらない枚
      - 更新する3枚は日付と価格を全部書き換える
      - 書き直す4枚は読者が変わると答えが変わる枚
      - 本当に考えるのは11枚のうち4枚だけ
  - type: steps
    title: 2回目のページを改稿する手順
    steps: [11枚に分けて「残す・更新・直す」に仕分ける, 1回目に届いた質問を集めて課題とFAQに戻す, 2回目に出す理由を1行で決めて表紙を書き直す, リターン・流れ・注意の日付と価格を全部書き換える, 前回からの変更点を1枚だけ足す, スマホで通し読みして「前回」の取り残しを消す]
  - type: calendar
    title: 2回目を出すまでの1か月
    weeks: ["1回目の質問を1か所に書き出す。11枚を仕分ける", "書き直す4枚と変更点1枚を作る。残す4枚は写真を確認", "日付と価格を書き換えて申請。審査の修正に対応", "公開。1回目の支援者に先に知らせる"]
