thumbnail:
  title: ココナラでクラファンページを頼む前に
  sub: 納期が延びる5つの場所と、頼む前の1〜2日の準備

figures:
  - type: compare
    title: 表示の納期どおりに進むかは「頼む前」で決まる
    left:
      head: 準備なしで頼むと
      rows: ["写真待ちで制作が始まらない", "構成の質問が3往復で1週間", "修正を小出しにして往復が増える", "画像だけの納品で1文直すにも依頼", "納品後に入稿と審査が残る"]
    right:
      head: 準備してから頼むと
      rows: ["素材フォルダを渡した日から数える", "2行の方針で質問が減る", "修正は1回にまとめる", "直せる形式を先に確かめる", "公開日から逆算して依頼日を決める"]
  - type: steps
    title: 頼む前に1〜2日でやる準備
    steps: [公開日から逆算して依頼日を決める, 素材を1つのフォルダにそろえる, 「誰に・何を一番に」を2行で書く, 11枚の型で文章の下書きを書く, 出品ページの5項目を確かめる, 同じ依頼文で2〜3人に見積もりを頼む, 初稿が届いたら修正は1回にまとめる]
  - type: lp_sample
    title: 下書きは11枚に分けて書く
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 1枚に1つのことだけ、1〜3行でよい
      - 書けた枚と考えてほしい枚を分けて渡す
      - 写真がある枚と無い枚を分けて書く
      - 質問の往復が減り、見積もりがそろう
  - type: calendar
    title: 依頼から公開まで（表示の納期が2週間の例）
    weeks: ["素材フォルダと下書きを渡す。質問にはその日に返す", "制作を待つ間にリターンと価格、告知文を固める", "初稿を確認。修正は1回にまとめて入稿", "申請。審査の修正に対応。公開と初動の告知"]
