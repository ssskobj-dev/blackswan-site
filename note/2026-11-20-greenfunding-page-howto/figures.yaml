thumbnail:
  title: GREEN FUNDINGの ページの作り方
  sub: 相談→審査→ページ作成。Makuakeと違う3点

figures:
  - type: compare
    title: GREEN FUNDINGと、Makuake・CAMPFIREの違い
    left:
      head: GREEN FUNDING
      rows: [相談フォーム→審査→ページ作成, オールオアナッシングのみ, "手数料20%（税込・決済込み）", 画像サイズの公式の目安は無い, 本文は文字と画像を混ぜられる]
    right:
      head: Makuake・CAMPFIRE
      rows: [CAMPFIREは編集画面から作る, All inも選べる（両社とも）, "20%税抜／17%税別（決済込み）", ヘルプに推奨サイズがある, Makuakeは画像を縦に並べる]
  - type: steps
    title: GREEN FUNDINGに出す7つの手順
    steps: [商品の説明を1枚にまとめ、相談フォームから送る, 審査を待つあいだに写真8カットと仕様をそろえる, 目標は「下回ると作れない額」。手数料20%を引いて考える, ページを「スライド1枚＝1セクション」で作る, 支援プランを「画像1枚で分かる」ように作る, メイン画像と、あれば30秒の動画を用意する, 公開日と活動報告3回の予定を決める]
  - type: lp_sample
    title: 本文は11枚の型で作り、見出しは画像・説明は文字
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [見出しと主役の写真だけ画像で書き出す, 説明の文章は文字で打つ（1行ずつ直せる）, 本文の画像は横幅を1種類にそろえる, 「リターン」は支援プランと数・金額を合わせる, 「注意」に発送の遅れ・色味の差・返品の条件を書く]
  - type: compare
    title: 支援プランのカードと本文、どこに何を書くか
    left:
      head: 支援プランのカード
      rows: [画像1枚で何個・何色か分かる, 金額と限定数, 1行目は「何が、いつ届くか」, 中身は「詳細を見る」の中]
    right:
      head: 本文（ホーム）
      rows: [リターンの枚に全プランを並べる, 「限定○名」を本文にも書く, 発送時期・色味の差・返品の条件, 相談で変わる部分は文字で打つ]
