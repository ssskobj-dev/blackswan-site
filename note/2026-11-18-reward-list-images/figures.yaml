thumbnail:
  title: クラファン リターン 画像の作り方
  sub: 一目で選べる一覧にする｜表→型→差し替えの3段階

figures:
  - type: compare
    title: リターン画像、選ばれない一覧と一目で選べる一覧
    left:
      head: 商品写真をそのまま置く
      rows: ["全コースが同じ写真で区別なし", "文字が小さく縮むと読めない", "割引率・数量が書いてない", "本文の数字と食い違う", "1枚ずつ別々に作って不ぞろい"]
    right:
      head: 表→型→差し替えで作る
      rows: ["先に全コースの表を1枚作る", "1つの型にコース名・写真・割引率", "割引率は画像の高さの1/3", "変えるのはコース名・割引率・数量", "本文の一覧も同じ表から作る"]
  - type: steps
    title: リターン画像を一目で選べる一覧にする7つの手順
    steps: [全コースの表を1枚作る（名前・価格・割引率・数量・お届け月）, 690×388の型を決める（上に名前、中に写真と割引率、下に価格）, コースごとに変えるのはコース名・割引率・数量の3か所だけ, セット・色違いは写真と選択肢で見せ分ける, PowerPointで型を作りコース数分だけ複製する, 本文のリターン一覧も同じ表から1枚作る, 公開前にスマホで一覧を見て5つを確かめる]
  - type: compare
    title: 1枚の型で、変える所と変えない所
    left:
      head: 全コースで同じにする
      rows: ["商品写真（セットは個数分）", "文字の位置と大きさ", "下の帯の並び（価格・数量・月）", "無地の背景、文字は写真の外に", "サイズ690×388（16:9）"]
    right:
      head: コースごとに変える所
      rows: ["コース名（超早割・早割・通常割）", "帯の色（深い割引ほど強い色）", "割引率（一番大きな文字）", "数量（限定20個など）", "セットだけ写真を差し替える"]
  - type: lp_sample
    title: 本文の「リターンの枚」は、同じ表を縦に並べるだけ
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - リターンの枚＝全コースを1画面で見比べる
      - 個別のリターン画像と同じ表から作る
      - 数字がそろい、食い違いが起きない
      - 注意の枚に「公開後は変更不可」を書く
      - 翌月は表と写真を差し替えるだけ
