thumbnail:
  title: クラファン 支援が集まらないページの共通点3つ
  sub: 商品を変えずに、今日直せる順に

figures:
  - type: compare
    title: 支援が集まらないページと、集まりやすいページ
    left:
      head: 集まらないページ
      rows: ["表紙が商品名とスペックだけ", "「高品質」など言葉だけで説明", "白背景の商品写真が1枚", "リターンが1種類、または10種類", "いつ届くか書いていない", "公開した日に誰も見に来ない"]
    right:
      head: 集まりやすいページ
      rows: ["相手・困りごと・一言が先", "本体210g、6時間後に70度", "使っている場面の写真が先頭", "早割・本体・セットの3段", "流れ・注意・FAQで不安に答える", "2週間前から声掛けとお気に入り"]
  - type: lp_sample
    title: 3つの共通点は、この枚を直す
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 共通点1：表紙・課題の2枚
      - 共通点2：特徴・使い方・仕様の3枚
      - 共通点3：リターン・流れ・注意・FAQ
      - 反応が悪ければ、1枚だけ作り直す
      - 11枚の分け方は BlackSwan と同じ
  - type: steps
    title: 今日から自分で直す7つの手順
    steps: [他人としてスマホで30秒だけ見る, 表紙を「相手・困りごと・一言」で書き直す, 写真を「使っている場面」に並べ替える, 形容詞を数字に置き換える, リターンを早割・本体・セットの3段に, 「流れ」「注意」「FAQ」を足す, 公開の2週間前から見てもらう準備]
  - type: calendar
    title: 直してから公開するまでの1か月
    weeks: ["30秒テストで 現状を知る 表紙を3行で 書き直す", "場面の写真を 撮って並べる 形容詞を 数字に直す", "リターンを 3段にそろえ 流れ・注意・ FAQを足す", "知人に見せて 感想をもらう お気に入りを 集めて公開"]
