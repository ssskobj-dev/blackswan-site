thumbnail:
  title: アパレル クラファン ページの書き方
  sub: サイズは「製品寸法」、素材は「組成＋着心地」で書く

figures:
  - type: compare
    title: 止まる書き方と、選べる書き方
    left:
      head: 止まる（判断できない）
      rows: ["サイズは S・M・L の記号だけ", "ヌード寸法か製品寸法か不明", "モデルの身長・着用サイズが無い", "素材は「上質」「こだわり」だけ", "洗い方が書かれていない"]
    right:
      head: 選べる（自分で判断できる）
      rows: ["1サイズ4か所の製品寸法をcmで", "「平置きの製品寸法」と明記", "身長・体重・着用サイズ・着用感", "組成＋厚さ・透け・伸び・手触り", "洗濯表示と同じ内容を言葉でも"]
  - type: steps
    title: アパレルのページを作る手順
    steps: [1サイズにつき4か所の製品寸法を測る, モデルの身長・体重・着用サイズを1行で, 「手持ちの服と比べてください」を入れる, 素材は「組成」と「着心地」を分けて書く, 着心地は厚さ・透け・伸び・手触り・季節, 写真は全身→色→生地→平置き→場面の順, 11枚に分けてアパレル用に割り当てる]
  - type: lp_sample
    title: アパレル用の11枚の割り当て
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 表紙：全身の着用写真と一言
      - 特徴：着心地の5つの言葉と生地の寄り
      - 使い方：着回しの場面写真
      - 仕様：サイズ表・組成・洗濯表示
      - リターン：色×サイズの組み合わせ
      - 注意：誤差・色の見え方・縮み
  - type: compare
    title: サイズの1枚を書き直す前と後
    left:
      head: 書き直す前
      rows: ["サイズ：S／M／L", "素材：上質なコットン", "モデル着用：M", "→ 自分に合うか分からない"]
    right:
      head: 書き直した後（サイズだけ）
      rows: ["平置き写真に4か所の線と数字", "サイズごとの数字を横に並べる", "製品寸法と誤差の幅を1行で", "「身長〇cm・M着用・ゆったり」", "「手持ちの服と比べて」の1行"]
  - type: calendar
    title: 服を出すまでの1か月
    weeks: ["全サイズを 採寸して 組成と洗濯の 表示を 確かめる", "モデルと 色展開を 撮影して 11枚を作る", "色×サイズの リターンを 決めて申請 審査の修正に 対応する", "公開して サイズの質問に 答え FAQの枚に 足していく"]
