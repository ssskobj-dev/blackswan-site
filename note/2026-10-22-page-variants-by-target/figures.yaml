thumbnail:
  title: クラファンページの量産
  sub: 同じ商品をターゲット別に作り分ける手順

figures:
  - type: compare
    title: 量産で崩れる作り方と、崩れない作り方
    left:
      head: 1本ずつゼロから作る
      rows: [版ごとに構成から考え直す, 1版あたり5〜8時間, 共通の枚数も毎回直す, どれが最新か分からなくなる]
    right:
      head: マスターから差し替える
      rows: [構成はマスターと同じ, 1版あたり1〜2時間, 直すのは3〜4枚だけ, 共通の枚数はマスターで管理]
  - type: steps
    title: ターゲット別に作り分ける6つの手順
    steps: [基準の1本を11枚の型で作る（マスター）, ターゲットを2〜3つ、1行ずつ決める, 変える枚数を3〜4枚に絞る, 表紙・課題・解決・使い方を版ごとに書く, マスターを複製し「商品_ターゲット_日付」で保存, 縦長に書き出してスマホで通しで読む]
  - type: compare
    title: 11枚を「共通」と「版ごとに変える」に分ける
    left:
      head: 共通（マスターで管理）
      rows: [仕様, リターン, 流れ, 注意, よくある質問, ストーリーの事実の部分]
    right:
      head: 版ごとに変える
      rows: [表紙の一言と場面の写真, 課題（困りごとを1つだけ）, 解決（その困りごとの答え）, 使い方（場面の写真）]
  - type: lp_sample
    title: 変えるのは11枚のうち3〜4枚
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [表紙・課題・解決・使い方を版ごとに変える, 仕様・リターン・流れ・注意・FAQは共通, 基準の1本（マスター）を複製して作る, 版の名前は「商品_ターゲット_日付」]
