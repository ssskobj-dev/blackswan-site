thumbnail:
  title: Makuake 画像サイズと枚数の正解
  sub: 本文は横1230px・3枚以上。縦長ページの作り方

figures:
  - type: compare
    title: Makuakeで用意する画像（公式ヘルプ 2026年6月更新）
    left:
      head: 縦横が決まっているもの
      rows: ["キービジュアル 1600×900", "リターン画像 690×388", "プロフィール 400×400", "いずれも形式はJPG・PNG・GIF"]
    right:
      head: 横幅だけ決まっているもの
      rows: ["本文の画像 横1230px（必須）", "縦の長さは自由", "1枚2MB以内が推奨", "3枚以上が必要"]
  - type: steps
    title: 縦長ページの画像を自分で作る手順
    steps: [必要な画像を4種類に分けて数える, スライドの幅を横1230px相当にする, 1枚＝1セクションで11枚作る, 文字は1行20字まで・大きめに, 1枚ずつPNGで書き出す, 横幅と容量を確認する, 上から順にアップロードする]
  - type: lp_sample
    title: 本文の画像は「スライド1枚＝1セクション」
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 横幅は全部1230pxでそろえる
      - 縦の長さは枚ごとに変えてよい
      - 1枚に伝えることは1つ
      - 直すときは1枚だけ作り直す
  - type: compare
    title: 粗くなるページと、きれいに出るページ
    left:
      head: やりがちな作り方
      rows: ["横幅がばらばらの画像を並べる", "1枚に全部を詰めて縦に長くする", "小さい写真を引き伸ばす", "スマホで読めない小さい文字"]
    right:
      head: この記事の作り方
      rows: ["横1230pxに全部そろえる", "11枚に分けて1枚2MB以内", "写真は元の大きさ以下で置く", "1行20字まで・文字は大きめ"]
