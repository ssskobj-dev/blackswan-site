thumbnail:
  title: 食品 クラファン ページの作り方
  sub: ラベルを先に作り、写真は「食べる瞬間→安心」の順に

figures:
  - type: compare
    title: 止まる書き方と、安心して選べる書き方
    left:
      head: 止まる（判断できない）
      rows: ["原材料は「厳選した国産素材」", "アレルゲンが書かれていない", "期限は「製造から90日」だけ", "味は「こだわり」「やさしい」", "写真は映えの1枚だけ"]
    right:
      head: 選べる（自分で判断できる）
      rows: ["ラベルの原材料名をそのまま写す", "特定原材料9品目を1行で", "「お届けから約60日以上」", "比べる言葉＋食べ方3つ", "食べる瞬間→安心の6枚"]
  - type: steps
    title: 食品のページを作る手順
    steps: [保健所に許可か届出が要るかを先に確かめる, 表示のラベル（9項目）をページより先に作る, アレルゲンをラベルとページの両方に書く, 期限と保存方法は「届いてから何日」で書く, 味は「比べる言葉」と「食べ方3つ」で書く, 写真は食べる瞬間→食べ方→原材料→作り手→量→安心, 11枚に分けて食品用に割り当てる]
  - type: lp_sample
    title: 食品用の11枚の割り当て
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes:
      - 表紙：食べる瞬間の写真と一言
      - 特徴：比べる言葉で書いた味と食感
      - 使い方：食べ方3つと食卓の写真
      - 仕様：ラベルの内容をそのまま写す
      - 流れ：お届けの時期と温度帯
      - 注意：期限・配送・写真との差
  - type: compare
    title: 「仕様」の1枚を書き直す前と後
    left:
      head: 書き直す前
      rows: ["原材料：厳選した国産素材", "賞味期限：製造から90日", "保存：冷暗所", "→ 何が入っているか分からない"]
    right:
      head: 書き直した後（仕様だけ）
      rows: ["原材料名と添加物を量の多い順に", "アレルゲン：小麦・卵・乳", "内容量：1袋120g（約6枚）", "賞味期限：お届けから約60日以上", "保存：常温。開封後は冷蔵3日"]
  - type: calendar
    title: 食品を出すまでの1か月
    weeks: ["保健所に 確かめて ラベルの 9項目と アレルゲンを 埋める", "料理と 盛り付けを 用意して 6種類の 写真を撮る", "11枚を作り リターンと 届く時期を 揃えて申請 審査に対応", "公開して 日持ちや 食べ方の 質問に答え FAQに足す"]
