thumbnail:
  title: 輸入物販のクラファンページ
  sub: 制作費を1件1,000円台に下げる考え方

figures:
  - type: compare
    title: 高くなる作り方と、安くなる作り方
    left:
      head: 海外ページをそのまま翻訳
      rows: [構成が日本の読者に合わない, 翻訳と作り直しが二重に起きる, 商品ごとにゼロから依頼, 1件あたり約10万円のまま]
    right:
      head: 素材を集めて型に並べる
      rows: [先にメーカーから素材をそろえる, 11枚の型に文字と写真を入れる, 共通の枚数はシリーズで使い回す, 作業は差し替えだけになる]
  - type: steps
    title: 輸入物販のページを1,000円台に近づける6つの手順
    steps: [メーカーから集める素材を一覧にして依頼する, 海外ページを翻訳せず「事実」だけ抜き出す, 11枚の型を1回だけ作る（マスター）, 共通の枚数と商品ごとの枚数に分ける, 2〜3商品まとめて同じ週に作る, 1件あたりの金額と時間を書き出す]
  - type: lp_sample
    title: 輸入物販の11枚｜共通で使える枚数が多い
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [流れ・注意・FAQ・販売元は全商品で共通, 仕様はメーカーの表を日本語にして貼る, 表紙・課題・解決・特徴だけ商品ごとに書く, 商品が増えるほど1件の手間が減る]
  - type: compare
    title: 1件あたりの金額で比べる
    left:
      head: 商品ごとに単発で外注
      rows: ["約10万円／件（相場）", "納期2週間〜1か月", "翻訳や構成を毎回説明", "年12商品で約120万円"]
    right:
      head: 型を手元に持って月額制
      rows: ["スタンダード 月額7,980円で6件", "1件あたり1,330円", "プロなら15件で1件987円", "翌営業日に届き、自分で直せる"]
