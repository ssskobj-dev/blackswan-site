thumbnail:
  title: クラファンページ外注の 依頼書の書き方
  sub: 1回で伝わる10項目と、質問の往復を減らす段取り

figures:
  - type: steps
    title: 依頼書を作る7つの手順
    steps: [10項目の見出しだけ先に1枚のファイルに書く, 決まっている項目から埋め、未定は「未定・期日」と書く, 数字には根拠を添える（測った・試験した・比べた）, 参考ページを3つ、好きな点と避けたい点を1行ずつ, 任せる範囲と自分で決める範囲を分けて書く, 写真と資料を段の名前のフォルダに入れて共有する, 初稿の返事と修正の回数・期日を先に決める]
  - type: compare
    title: 質問の往復を減らす依頼書
    left:
      head: よくある頼み方
      rows: [チャットで思いついた順に送る, 「いい感じに」「おしゃれに」, 写真は後から小出しに届く, 価格とリターンが初稿の後に決まる, 修正の回数と期日があいまい]
    right:
      head: 1回で伝わる依頼書
      rows: [10項目を1枚のファイルに, 参考ページ3つと好き・嫌いを1行, 素材は段の名前のフォルダで一括, 価格・リターン・お届けは先に確定, 初稿の返事と修正2回の期日を明記]
  - type: compare
    title: 依頼書の10項目
    left:
      head: 前半：商品を伝える5項目
      rows: [1 一言で言うと（何を・誰に）, 2 ターゲットの具体像, 3 独自性（最大3つ）, 4 数字で言えること＋根拠, 5 仕様（寸法・重さ・素材・色）]
    right:
      head: 後半：ページを形にする5項目
      rows: [6 使い方・使うシーン, 7 価格・リターン・お届け予定, 8 ストーリー（作った理由）, 9 リスク・注意・FAQ, 10 素材・参考ページ・納品形式]
  - type: lp_sample
    title: 10項目は、11枚の型にそのまま入る
    sections: [表紙, 課題, 解決, 特徴, 使い方, 仕様, ストーリー, リターン, 流れ, 注意, FAQ]
    notes: [表紙・課題・解決 → 項目1・2, 特徴 → 項目3・4, 使い方 → 項目6, 仕様 → 項目5, ストーリー → 項目8, リターン・流れ → 項目7, 注意・FAQ → 項目9]
